                                            <a href="https://www.facebook.com/profile.php?id=61550559295379" target="_blank" rel="noopener noreferrer" className="w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-all backdrop-blur-sm hover:scale-110 active:scale-95"><Icons.Facebook size={20} /></a>
                                            <a href="https://www.instagram.com/shon_anderson_strategy" target="_blank" rel="noopener noreferrer" className="w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-all backdrop-blur-sm hover:scale-110 active:scale-95"><Icons.Instagram size={20} /></a>
                                            <a href="#" className="w-12 h-12 bg-white/10 hover:bg-white/20 rounded-full flex items-center justify-center transition-all backdrop-blur-sm hover:scale-110 active:scale-95"><Icons.Linkedin size={20} /></a>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    {/* Footer */}
                    <footer className="bg-[#3D4553] text-[#F5F0EB]/60 py-12 text-sm border-t border-white/5">
                        <div className="container mx-auto px-4 flex flex-col md:flex-row justify-between items-center gap-6">
                            <div className="flex items-center gap-3 group cursor-pointer">
                                <CompassLogo className="w-8 h-8 opacity-80 transition-transform group-hover:scale-110 group-hover:rotate-180 duration-700" />
                                <span className="text-lg font-bold text-[#F5F0EB] group-hover:text-[#D4A96A] transition-colors">שון אנדרסון</span>
                            </div>
                            <div className="text-center md:text-right">
                                &copy; {new Date().getFullYear()} שון אנדרסון. כל הזכויות שמורות. <br className="md:hidden"/> עיצוב ובנייה בהשראת האמת הפנימית שלכם.
                            </div>
                            <div className="flex gap-6 font-medium">
                                <a href="#home" className="hover:text-[#D4A96A] transition-colors hover:underline underline-offset-4">ראשי</a>
                                <a href="#process" className="hover:text-[#D4A96A] transition-colors hover:underline underline-offset-4">התהליך</a>
                                <a href="#contact" className="hover:text-[#D4A96A] transition-colors hover:underline underline-offset-4">צור קשר</a>
                                <a href="/terms.html" className="hover:text-[#D4A96A] transition-colors hover:underline underline-offset-4">תקנון</a>
                                <a href="/landing-offer.html" className="hover:text-[#D4A96A] transition-colors hover:underline underline-offset-4">בניית אתרים</a>
                            </div>
                        </div>
                    </footer>

                    {/* Scheduling Bot */}
                    {botOpen && (
                        <div className="fixed bottom-24 left-6 z-50 w-[340px] max-h-[500px] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden animate-fade-in-down">
                            <div className="bg-[#3D4553] text-[#F5F0EB] px-5 py-4 flex justify-between items-center rounded-t-2xl">
                                <div className="flex items-center gap-2">
                                    <div className="w-8 h-8 bg-[#D4A96A] rounded-full flex items-center justify-center text-sm font-bold">ש</div>
                                    <div>
                                        <p className="font-bold text-sm">תיאום שיחה עם שון</p>
                                        <p className="text-xs opacity-70">בדרך כלל עונה תוך שעה</p>
                                    </div>
                                </div>
                                <button onClick={() => setBotOpen(false)} className="hover:bg-white/10 rounded-full p-1 transition-colors">
                                    <Icons.X size={18} />
                                </button>
                            </div>
                            <div className="flex-1 overflow-y-auto p-4 space-y-3 bg-[#F5F0EB]/50" style={{maxHeight: '340px'}}>
                                {botMessages.map((msg, i) => (
                                    <div key={i} className={`flex ${msg.from === 'bot' ? 'justify-start' : 'justify-end'}`}>
                                        <div className={`max-w-[85%] px-4 py-2.5 rounded-2xl text-sm leading-relaxed ${
                                            msg.from === 'bot'
                                                ? 'bg-white text-[#3D4553] rounded-br-sm shadow-sm'
                                                : 'bg-[#C4956A] text-white rounded-bl-sm'
                                        }`}>
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                                {botSending && (
                                    <div className="flex justify-start">
                                        <div className="bg-white px-4 py-3 rounded-2xl rounded-br-sm shadow-sm">
                                            <div className="flex gap-1">
                                                <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '0ms'}}></span>
                                                <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '150ms'}}></span>
                                                <span className="w-2 h-2 bg-gray-400 rounded-full animate-bounce" style={{animationDelay: '300ms'}}></span>
                                            </div>
                                        </div>
                                    </div>
                                )}
                                <div ref={botMessagesEndRef} />
                            </div>
                            <div className="p-3 border-t border-gray-100 bg-white">
                                {botStep < 5 ? (
                                    <form onSubmit={(e) => {
                                        e.preventDefault();
                                        const input = e.target.elements.botInput;
                                        const val = input.value.trim();
                                        if (!val) return;

                                        const userMsg = { from: 'user', text: val };
                                        input.value = '';

                                        setBotMessages(prev => [...prev, userMsg]);
                                        setBotSending(true);

                                        setTimeout(() => {
                                            let botReply = '';
                                            let newData = {...botData};

                                            if (botStep === 0) {
                                                newData.name = val;
                                                botReply = `נעים מאוד ${val}! 😊 מה מספר הטלפון שלך?`;
                                            } else if (botStep === 1) {
                                                newData.phone = val;
                                                botReply = 'מצוין! באיזה תאריך נוח לך? (לדוגמה: 15.2, יום ראשון הקרוב)';
                                            } else if (botStep === 2) {
                                                newData.date = val;
                                                botReply = 'ובאיזו שעה? (לדוגמה: 10:00, 14:30, אחה"צ)';
                                            } else if (botStep === 3) {
                                                newData.time = val;
                                                botReply = 'אחרון חביב - במשפט קצר, מה הנושא שהכי מעסיק אותך כרגע בעסק?';
                                            } else if (botStep === 4) {
                                                newData.topic = val;
                                                botReply = `תודה רבה ${newData.name}! 🙏 אני שולחת את הפרטים לשון:\n\n📅 ${newData.date} בשעה ${newData.time}\n📞 ${newData.phone}\n📝 ${newData.topic}\n\nשון תיצור איתך קשר בהקדם לאישור. יום מעולה! ✨`;

                                                // Send to email via Web3Forms
                                                fetch('https://api.web3forms.com/submit', {
                                                    method: 'POST',
                                                    headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({
                                                        access_key: '1433827c-05f5-4d54-8966-59f84bc4b6c6',
                                                        subject: '🗓️ בקשה לתיאום פגישה - ' + newData.name,
                                                        from_name: 'בוט תיאום פגישות - אתר שון',
                                                        name: newData.name,
                                                        phone: newData.phone,
                                                        date: newData.date,
                                                        time: newData.time,
                                                        topic: newData.topic,
                                                        message: `בקשה חדשה לתיאום פגישה:\n\nשם: ${newData.name}\nטלפון: ${newData.phone}\nתאריך מבוקש: ${newData.date}\nשעה מבוקשת: ${newData.time}\nנושא: ${newData.topic}`
                                                    })
                                                });
                                                // Send to Monday.com
                                                sendToMonday({
                                                    name: newData.name,
                                                    phone: newData.phone,
                                                    message: `תיאום פגישה: ${newData.date} בשעה ${newData.time}\nנושא: ${newData.topic}`,
                                                    email: '',
                                                    source: 'בוט תיאום פגישות'
                                                });
                                            }

                                            setBotData(newData);
                                            setBotMessages(prev => [...prev, { from: 'bot', text: botReply }]);
                                            setBotSending(false);
                                            setBotStep(prev => prev + 1);
                                            setTimeout(() => botMessagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                                        }, 800);

                                        setTimeout(() => botMessagesEndRef.current?.scrollIntoView({ behavior: 'smooth' }), 100);
                                    }} className="flex gap-2">
                                        <input
                                            name="botInput"
                                            type="text"
                                            placeholder={
                                                botStep === 0 ? 'הקלידו את שמכם...' :
                                                botStep === 1 ? 'מספר טלפון...' :
                                                botStep === 2 ? 'תאריך מבוקש...' :
                                                botStep === 3 ? 'שעה מבוקשת...' :
                                                'ספרו בקצרה...'
                                            }
                                            className="flex-1 border border-gray-200 rounded-full px-4 py-2.5 text-sm focus:outline-none focus:border-[#C4956A] focus:ring-1 focus:ring-[#C4956A] text-right"
                                            autoFocus
                                        />
                                        <button type="submit" className="bg-[#C4956A] hover:bg-[#b0845c] text-white w-10 h-10 rounded-full flex items-center justify-center transition-colors active:scale-95">
                                            <Icons.ArrowLeft size={18} />
                                        </button>
                                    </form>
                                ) : (
                                    <button onClick={() => { setBotOpen(false); setBotStep(0); setBotData({ name: '', phone: '', date: '', time: '', topic: '' }); setBotMessages([{ from: 'bot', text: 'היי! 👋 אני העוזרת הדיגיטלית של שון. אשמח לעזור לך לתאם שיחת היכרות. מה השם שלך?' }]); }} className="w-full bg-[#3D4553] hover:bg-[#2A303C] text-white py-3 rounded-full font-bold text-sm transition-colors active:scale-95">
                                        סגירה
                                    </button>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Bot Toggle Button */}
                    <button
                        onClick={() => setBotOpen(!botOpen)}
                        className="fixed bottom-6 left-24 z-50 bg-[#C4956A] hover:bg-[#b0845c] text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transition-all hover:scale-110 active:scale-95"
                        title="תיאום שיחה"
                    >
                        {botOpen ? <Icons.X className="w-7 h-7" /> : (
                            <svg className="w-7 h-7" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" /></svg>
                        )}
                    </button>

                    {/* Floating WhatsApp Button */}
                    <a
                        href="https://wa.me/972528772385?text=%D7%94%D7%99%D7%99%20%D7%A9%D7%95%D7%9F%2C%20%D7%90%D7%A9%D7%9E%D7%97%20%D7%9C%D7%A9%D7%9E%D7%95%D7%A2%20%D7%A2%D7%9C%20%D7%94%D7%9C%D7%99%D7%95%D7%95%D7%99%20%D7%A9%D7%9C%D7%9A"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="fixed bottom-6 left-6 z-40 bg-[#25D366] hover:bg-[#1da851] text-white w-16 h-16 rounded-full flex items-center justify-center shadow-2xl transition-all hover:scale-110 active:scale-95 animate-whatsapp-pulse md:flex hidden"
                        title="שלחו הודעה בוואטסאפ"
                    >
                        <Icons.WhatsApp className="w-8 h-8" />
                    </a>

                    {/* Mobile Sticky CTA */}
                    <div className="fixed bottom-0 left-0 right-0 z-50 md:hidden bg-[#3D4553] border-t border-[#D4A96A]/30 px-4 py-3 flex gap-3 shadow-2xl">
                        <a href="#booking" className="flex-1 bg-[#D4A96A] hover:bg-[#C4956A] text-white py-3 rounded-full font-bold text-center text-sm transition-all active:scale-95">
                            קביעת פגישה חינמית
                        </a>
                        <a href="https://wa.me/972528772385" target="_blank" rel="noopener noreferrer" className="bg-[#F5F0EB]/10 border border-[#F5F0EB]/20 text-[#F5F0EB] px-4 py-3 rounded-full font-bold text-sm flex items-center gap-2 transition-all active:scale-95">
                            <Icons.WhatsApp className="w-4 h-4" />
                            וואטסאפ
                        </a>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<BusinessWebsite />);
    </script>
</body>
</html>
